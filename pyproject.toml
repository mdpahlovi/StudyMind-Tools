[project]
name = "tools"
version = "0.1.0"
description = "Tools for StudyMind AI"
readme = "README.md"
authors = [
    { name = "MD Pahlovi", email = "mdpahlovi@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling[asr]>=2.141.0",
    "fastapi[standard]>=0.159.1",
    "gtts>=2.5.4",
    "markdown-pdf>=1.13.3",
    "mutagen>=1.48.1",
    "pika>=1.4.4",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["app", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["gtts.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true

[tool.pyrefly]
site-package-path = [".venv/Lib/site-packages"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
